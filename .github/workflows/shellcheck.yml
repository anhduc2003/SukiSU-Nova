name: ShellCheck

# Rewritten for the self-hosted Forgejo runner: no `uses:` actions, so the job
# never needs github.com. ShellCheck comes from the distribution packages.
#
# The checkout uses the public HTTPS URL, not the EasyTier address the runner
# itself talks to: build containers get their own network namespace and cannot
# reach the WSL tunnel (tun0), while the public endpoint is reachable from both.
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - '**/*.sh'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - '**/*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          remote="https://git.zako.shirkneko.top:20004"
          mirror="/ci/repo-cache/${GITHUB_REPOSITORY}.git"
          # The self-hosted runner keeps one bare mirror per repository on a
          # shared /ci volume. A GitHub-hosted runner, which is what a fork's
          # pull request gets, has no such volume: fall back to a direct clone
          # instead of failing before any code is read.
          if mkdir -p "$(dirname "$mirror")" 2>/dev/null; then
            if [ ! -d "$mirror" ]; then
              set +x
              git -c "http.${remote}/.extraHeader=Authorization: token ${TOKEN}" \
                clone -q --mirror "${remote}/${GITHUB_REPOSITORY}.git" "$mirror"
              set -x
            elif command -v flock >/dev/null 2>&1; then
              (
                flock 9
                git --git-dir="$mirror" fetch -q --prune origin \
                  "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
              ) 9>"${mirror}.lock"
            else
              git --git-dir="$mirror" fetch -q --prune origin \
                "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
            fi
            git clone -q --shared --no-checkout "$mirror" .
            git checkout -q "${GITHUB_SHA}"
          else
            # The ref, not ${GITHUB_SHA}: on a pull_request event the SHA is the
            # merge commit, which a plain clone does not fetch.
            git init -q .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            set +x
            git -c "http.https://github.com/.extraHeader=Authorization: token ${TOKEN}" \
              fetch -q --depth 1 origin "${GITHUB_REF}"
            set -x
            git checkout -q FETCH_HEAD
          fi

      - name: Check toolchain
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck is not preinstalled, installing it"
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq shellcheck
            else
              apt-get update -qq
              apt-get install -y -qq shellcheck
            fi
          fi
          shellcheck --version | head -2

      - name: Run ShellCheck
        run: |
          set -eux
          shellcheck --version | head -2
          # Same exclusions as the previous marketplace action config.
          mapfile -t files < <(
            git ls-files '*.sh' \
              | grep -v -E '(^|/)(gradlew)$' \
              | grep -v -E '^userspace/ksud/src/installer\.sh$' \
              | grep -v -E '^\.github/scripts/setup-rust-build\.sh$' \
            || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts to check"
            exit 0
          fi
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck -x "${files[@]}"
